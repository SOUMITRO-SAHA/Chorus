[package]
name = "chorus"
version = "0.1.0"
authors = ["you"]
edition = "2024"
description = "A Tauri App"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chorus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
blocker = { path = "crates/blocker" }
browser-store = { path = "crates/browser-store" }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "macros"] }
urlencoding = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-web-kit = { version = "0.3", features = [
  "WKContentRuleList",
  "WKContentRuleListStore",
  "WKUserContentController",
  "WKWebView",
  "WKWebViewConfiguration",
] }
objc2-foundation = { version = "0.3", features = ["NSError", "NSString"] }
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Android debug builds ship the .so inside the APK — full debug info makes it
# hundreds of MB. Line tables + stripped debuginfo keep on-device installs
# small; native-level debugging happens on desktop, not in the emulator.
[profile.dev]
debug = 1
strip = "debuginfo"

[workspace]
members = ["crates/blocker", "crates/browser-store"]
